name: Studio CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: videotools/HyperKut Studio
    steps:
      - name: Check out compatible VideoTools runtime
        uses: actions/checkout@v4
        with:
          repository: MajoorWaldi/ComfyUI-Majoor-VideoTools
          ref: 9564c0f3edf5fe11ed1e06d001493ba57d0f2735
          path: videotools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: videotools/HyperKut Studio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            videotools/HyperKut Studio/requirements.txt
            videotools/HyperKut Studio/requirements-dev.txt
            videotools/HyperKut Studio/constraints-release.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints-release.txt -r requirements-dev.txt
      - name: Verify clean-checkout modules and imports
        run: |
          git ls-files --error-unmatch backend/snapshot_schema.py backend/remote_graph.py backend/artifact_transfer.py
          python -c "import backend.server, backend.unified_motion, backend.remote_graph"
          python -c "from backend.snapshot_schema import motion_contract, motion_library; motion_contract().validate_motion_rows(motion_library().expand_rows([{'template': 'end_card', 'start': 0, 'end': 2, 'title': 'CI'}]))"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: videotools/HyperKut Studio/frontend
    steps:
      - name: Check out compatible VideoTools editor
        uses: actions/checkout@v4
        with:
          repository: MajoorWaldi/ComfyUI-Majoor-VideoTools
          ref: 9564c0f3edf5fe11ed1e06d001493ba57d0f2735
          path: videotools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: videotools/HyperKut Studio
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: videotools/HyperKut Studio/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run lint
