name: Studio CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-release.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints-release.txt -r requirements-dev.txt
      - name: Verify clean-checkout modules and imports
        run: |
          git ls-files --error-unmatch backend/snapshot_schema.py backend/remote_graph.py backend/artifact_transfer.py
          python -c "import backend.server, backend.unified_motion, backend.remote_graph"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run lint
